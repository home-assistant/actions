name: Test hassfest

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

jobs:
  hassfest:
    runs-on: ubuntu-latest
    name: hassfest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Copy test integration to custom_components
        run: |
          mkdir -p custom_components
          cp -r test_files/dummy-integration custom_components/

      - name: Test hassfest
        uses: ./hassfest
